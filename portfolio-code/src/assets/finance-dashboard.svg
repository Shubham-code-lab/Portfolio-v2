<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title description">
  <title id="title">Finance dashboard interface</title>
  <desc id="description">A compact personal finance dashboard with navigation, portfolio totals, a performance chart, and investments.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0d1726"/><stop offset="1" stop-color="#142a3d"/></linearGradient>
    <linearGradient id="chart" x1="0" y1="1" x2="0" y2="0"><stop stop-color="#4fd1a1" stop-opacity="0"/><stop offset="1" stop-color="#4fd1a1" stop-opacity=".28"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dy="24" stdDeviation="28" flood-color="#020712" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#canvas)"/>
  <circle cx="1370" cy="90" r="290" fill="#4fd1a1" opacity=".06"/><circle cx="390" cy="980" r="390" fill="#5c8dff" opacity=".06"/>
  <g filter="url(#shadow)"><rect x="86" y="74" width="1428" height="852" rx="30" fill="#f5f7fa"/><path d="M116 74h252v852H116q-30 0-30-30V104q0-30 30-30z" fill="#101c2b"/></g>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <circle cx="147" cy="139" r="22" fill="#4fd1a1"/><path d="M137 140h20M147 130v20" stroke="#0c1725" stroke-width="5" stroke-linecap="round"/><text x="184" y="148" fill="#f7fbff" font-size="30" font-weight="700">Finance</text>
    <g font-size="18" fill="#93a3b8"><rect x="111" y="212" width="222" height="54" rx="12" fill="#1c3044"/><circle cx="140" cy="239" r="7" fill="#4fd1a1"/><text x="163" y="246" fill="#fff" font-weight="600">Dashboard</text><circle cx="140" cy="306" r="7" fill="#5c8dff"/><text x="163" y="313">Accounts</text><circle cx="140" cy="373" r="7" fill="#f6ba64"/><text x="163" y="380">My investments</text><circle cx="140" cy="440" r="7" fill="#cf83ff"/><text x="163" y="447">Stocks</text><circle cx="140" cy="507" r="7" fill="#ff7e8b"/><text x="163" y="514">Income</text><circle cx="140" cy="574" r="7" fill="#74d4e8"/><text x="163" y="581">Import data</text></g>
    <text x="419" y="141" fill="#101c2b" font-size="34" font-weight="750">Your financial picture</text><text x="419" y="174" fill="#6d7888" font-size="17">Portfolio, spending, and future plans in one connected view</text>
    <g><rect x="419" y="219" width="320" height="146" rx="18" fill="#fff" stroke="#dde3ea"/><text x="447" y="254" fill="#738093" font-size="16">Net worth</text><text x="447" y="307" fill="#142033" font-size="38" font-weight="750">₹18,65,922</text><rect x="447" y="326" width="92" height="24" rx="12" fill="#dff7ee"/><text x="463" y="344" fill="#16805e" font-size="13" font-weight="700">+12.4%</text><rect x="763" y="219" width="320" height="146" rx="18" fill="#fff" stroke="#dde3ea"/><text x="791" y="254" fill="#738093" font-size="16">Investments</text><text x="791" y="307" fill="#142033" font-size="38" font-weight="750">₹12,06,220</text><text x="791" y="342" fill="#16805e" font-size="14" font-weight="650">Latest market values</text><rect x="1107" y="219" width="350" height="146" rx="18" fill="#fff" stroke="#dde3ea"/><text x="1135" y="254" fill="#738093" font-size="16">Monthly savings</text><text x="1135" y="307" fill="#142033" font-size="38" font-weight="750">₹64,500</text><text x="1135" y="342" fill="#6d7888" font-size="14">Income minus spending</text></g>
    <rect x="419" y="397" width="694" height="447" rx="18" fill="#fff" stroke="#dde3ea"/><text x="448" y="439" fill="#142033" font-size="20" font-weight="700">Portfolio growth</text><text x="448" y="466" fill="#738093" font-size="14">Change % · Last 12 months</text><g stroke="#e8edf2"><path d="M462 530h606M462 600h606M462 670h606M462 740h606"/></g><path d="M463 752C520 730 538 747 590 696S675 678 721 623s76-19 123-72 77-16 116-54 68-37 108-53V798H463z" fill="url(#chart)"/><path d="M463 752C520 730 538 747 590 696S675 678 721 623s76-19 123-72 77-16 116-54 68-37 108-53" fill="none" stroke="#28a979" stroke-width="6" stroke-linecap="round"/><circle cx="844" cy="551" r="8" fill="#fff" stroke="#28a979" stroke-width="5"/><g fill="#8995a5" font-size="13"><text x="463" y="823">Oct</text><text x="650" y="823">Jan</text><text x="845" y="823">Apr</text><text x="1038" y="823">Sep</text></g>
    <rect x="1137" y="397" width="320" height="447" rx="18" fill="#fff" stroke="#dde3ea"/><text x="1165" y="439" fill="#142033" font-size="20" font-weight="700">Investments</text><g font-size="14"><text x="1165" y="482" fill="#738093">Asset</text><text x="1407" y="482" fill="#738093" text-anchor="end">Value</text><path d="M1165 501h242" stroke="#e8edf2"/><circle cx="1175" cy="539" r="10" fill="#4fd1a1"/><text x="1197" y="545" fill="#243145">Mutual funds</text><text x="1407" y="545" fill="#243145" text-anchor="end" font-weight="650">₹6.84L</text><circle cx="1175" cy="601" r="10" fill="#5c8dff"/><text x="1197" y="607" fill="#243145">Stocks</text><text x="1407" y="607" fill="#243145" text-anchor="end" font-weight="650">₹5.22L</text><circle cx="1175" cy="663" r="10" fill="#f6ba64"/><text x="1197" y="669" fill="#243145">Savings</text><text x="1407" y="669" fill="#243145" text-anchor="end" font-weight="650">₹1.55L</text></g><rect x="1165" y="726" width="242" height="72" rx="14" fill="#f0f5ff"/><text x="1187" y="755" fill="#5f6d80" font-size="13">Future monthly value</text><text x="1187" y="784" fill="#315fc4" font-size="22" font-weight="750">₹22.8L</text>
  </g>
</svg>
